; Planned firmware. A successful build does not pass a hardware milestone.
[platformio]
default_envs = olimex_pico2bb48

[env:olimex_pico2bb48]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = olimex_pico2bb48
framework = arduino
monitor_speed = 115200

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = -std=c++11 -D UNITY_INCLUDE_DOUBLE
