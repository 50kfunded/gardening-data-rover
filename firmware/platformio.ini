; Planned firmware. A successful build does not pass a hardware milestone.
[platformio]
default_envs = nucleo_g474re

[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = arduino
upload_protocol = stlink
monitor_speed = 115200

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = -std=c++11 -D UNITY_INCLUDE_DOUBLE
